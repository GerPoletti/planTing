name: Compilar Mirasol

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.29.3'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Revisiones previas (textos y estructura)
        run: |
          python3 tool/gen_strings.py
          python3 tool/check_strings.py
          python3 tool/static_check.py
      - name: Preparar plataformas y plugin
        run: python3 tool/bootstrap.py
      - run: flutter pub get
      - name: Analizar el código
        run: flutter analyze --no-fatal-infos
      - name: Pruebas
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mirasol-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (sin firmar)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Preparar plataformas y plugin
        run: python3 tool/bootstrap.py
      - run: flutter pub get
      - name: Compilar iOS sin firmar
        run: flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firmar
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r mirasol-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: mirasol-ios-sin-firmar
          path: mirasol-sin-firmar.ipa
