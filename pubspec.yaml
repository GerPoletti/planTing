name: plantapp
description: Mirasol - medí la luz que reciben tus plantas y cuidalas con calma.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  http: ^1.2.2
  share_plus: ^10.1.4
  mirasol_light:
    path: packages/mirasol_light

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/l10n/
